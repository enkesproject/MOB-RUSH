<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>MOB RUSH! — 20 Levels + Endless</title>
<meta name="theme-color" content="#181c23"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#181c23;font-family:"Segoe UI",system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;display:block;touch-action:none}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,10,16,.55);backdrop-filter:blur(3px)}
.panel{width:min(440px,calc(100vw - 36px));max-height:88vh;overflow:auto;background:linear-gradient(180deg,#262c38,#1b202a);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:24px 22px;color:#fff;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.title{font-size:40px;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,#ffd34d,#ff9d2e);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0 2px}
.sub{color:#aeb7c6;font-size:14px;line-height:1.5;margin:6px 0 10px}
.copy{margin-top:14px;font-size:11px;color:#7e8798;letter-spacing:.3px}
h2{margin:6px 0 10px;font-size:24px}
.btn{display:block;width:100%;margin:10px 0;padding:14px;border:none;border-radius:14px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(180deg,#3b82f6,#2563eb);cursor:pointer;box-shadow:0 5px 0 #1e40af}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1e40af}
.btn.green{background:linear-gradient(180deg,#34d399,#10b981);box-shadow:0 5px 0 #047857}
.btn.gray{background:linear-gradient(180deg,#64748b,#475569);box-shadow:0 5px 0 #334155}
.btn.cyan{background:linear-gradient(180deg,#22d3ee,#0891b2);box-shadow:0 5px 0 #0e7490}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.lv{position:relative;border:none;border-radius:14px;padding:10px 4px 8px;background:linear-gradient(180deg,#334155,#1e293b);color:#fff;font-weight:900;font-size:20px;cursor:pointer;border:1px solid rgba(255,255,255,.08)}
.lv .st{display:block;font-size:10px;color:#fbbf24;letter-spacing:1px;margin-top:2px}
.lv .diff{display:block;font-size:9px;font-weight:700;color:#94a3b8;white-space:nowrap;overflow:hidden}
.lv.locked{filter:grayscale(.9);opacity:.5}
.lv.done{background:linear-gradient(180deg,#0ea5e9,#0369a1)}
.hudbtn{position:fixed;z-index:15;width:44px;height:44px;border-radius:12px;background:rgba(15,18,26,.55);color:#fff;font-size:20px;font-weight:900;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(2px)}
#btnBack{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px}
#btnSnd{top:calc(env(safe-area-inset-top,0px) + 10px);right:62px;font-size:17px}
#btnFS{top:calc(env(safe-area-inset-top,0px) + 10px);right:114px;font-size:16px}
#btnPause{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
</style>
</head>

<script>
'use strict';
/* ================= UTIL ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function rr2(c,x,y,w,h,r){roundRect(c,x,y,w,h,r);c.fill();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+amt,0,255),g=clamp((n>>8&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return `rgb(${r},${g},${b})`;}
function speck(x,R,S,n,a){for(let k=0;k<n;k++){x.fillStyle=R()<.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`;x.fillRect(R()*S,R()*S,1.5,1.5);}}

/* ================= CANVAS ================= */
const cv=$('#game'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
function roadMetrics(){const w=Math.min(W*0.92,480);const x=(W-w)/2;return{x,w,cx:W/2,r:x+w};}

/* ============================================================
   AUDIO — 6 file eksternal + fallback synth otomatis.
   Atur volume di AU_VOL.
   ============================================================ */
const AU_SRC={
 shoot  :'https://res.cloudinary.com/sogbouii/video/upload/v1789578620/freesound_community-submachine-gun-79846.mp3',
 music  :'https://res.cloudinary.com/sogbouii/video/upload/v1789582560/Medan_Perang.mp3',
 pickup :'https://res.cloudinary.com/sogbouii/video/upload/v1789150310/Effect_Naik_Level.wav',
 bossBoom:'https://res.cloudinary.com/sogbouii/video/upload/v1789150308/Effect_Ledakan.mp3',
 win    :'https://res.cloudinary.com/sogbouii/video/upload/v1789150308/Effect_Kemenangan_Setiap_Level.mp3',
 click  :'https://res.cloudinary.com/sogbouii/video/upload/v1788837869/Energy_Impulse_02.wav'
};
const AU_VOL={shoot:.22,music:.30,pickup:.60,bossBoom:.75,win:.65,click:.50};
const AU_POOL={shoot:5};
const AU={};
(function(){
 for(const k in AU_SRC){
  const n=AU_POOL[k]||1,list=[];
  for(let i=0;i<n;i++){
   const a=new Audio(AU_SRC[k]);a.preload='auto';
   if(k==='music')a.loop=true;
   a.volume=AU_VOL[k];
   a._ok=true;a.addEventListener('error',()=>{a._ok=false;});
   list.push(a);
  }
  AU[k]={list,idx:0};
 }
})();
let AC=null,sound=true;
try{sound=localStorage.getItem('mr20snd')!=='0';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function beep(f,d,type,v,slide,delay){if(!sound)return;const a=ac();if(!a)return;const t0=a.currentTime+(delay||0);
 const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+d);
 g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
 o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.02);}
const FALL={
 shoot:()=>beep(520,.05,'triangle',.014,300),
 click:()=>beep(700,.04,'square',.03),
 pickup:()=>{beep(700,.07,'square',.05);beep(1100,.1,'square',.05,0,.07);},
 bossBoom:()=>{beep(90,.4,'square',.09,40);beep(60,.5,'sawtooth',.07,30,.02);},
 win:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.16,'triangle',.07,0,i*.13))
};
function auPlay(k,vol){
 if(!sound)return;
 const o=AU[k];if(!o)return;
 const a=o.list[o.idx=(o.idx+1)%o.list.length];
 if(!a||!a._ok){FALL[k]&&FALL[k]();return;}
 try{a.currentTime=0;a.volume=(vol!=null?vol:AU_VOL[k]);a.play().catch(()=>{});}catch(e){}
}
function musicStart(){if(!sound)return;const m=AU.music&&AU.music.list[0];if(!m||!m._ok)return;try{if(m.paused)m.play().catch(()=>{});}catch(e){}}
function musicStop(){const m=AU.music&&AU.music.list[0];if(!m)return;try{if(!m.paused)m.pause();}catch(e){}}
let lastHitS=0;
const sHit   =()=>{const n=performance.now();if(n-lastHitS<70)return;lastHitS=n;beep(150,.05,'square',.03,60);};
const sBad   =()=>beep(300,.16,'sawtooth',.05,140);
const sBoss  =()=>{beep(120,.5,'sawtooth',.08,60);beep(80,.6,'square',.06,50,.1);};
const sRoar  =()=>{beep(70,.55,'sawtooth',.10,45);beep(110,.4,'square',.07,60,.05);};
const sLose  =()=>beep(220,.6,'sawtooth',.07,80);
const sShield=()=>{beep(400,.15,'sine',.05);beep(600,.2,'sine',.05,0,.1);beep(800,.25,'sine',.05,0,.2);};
const sRocket=()=>{beep(140,.4,'sawtooth',.06,60);beep(900,.25,'triangle',.03,300,.05);};
const sBoom  =()=>{beep(90,.4,'square',.09,40);beep(60,.5,'sawtooth',.07,30,.02);};
const sSiren =()=>{beep(880,.12,'square',.04,660);beep(660,.12,'square',.04,880,.12);};
const sShoot =()=>auPlay('shoot');
const sClick =()=>auPlay('click');
const sGood  =()=>auPlay('pickup');
const sPickup=()=>auPlay('pickup');
const sWin   =()=>auPlay('win');
const sBossBoom=(v)=>auPlay('bossBoom',v);

/* ================= 20 THEMES ================= */
const THEMES=[
 {name:'Green Meadow', emoji:'🌳',side:'#3e9e49',road:'#cfd4da',edge:'#5b7a60',rtype:'slab',  stype:'grass'},
 {name:'City Sidewalk',emoji:'🏙️',side:'#9aa3ad',road:'#d7dbe0',edge:'#565d66',rtype:'tile',  stype:'plain'},
 {name:'Desert Dunes', emoji:'🏜️',side:'#e0c689',road:'#dcbd8f',edge:'#a8834e',rtype:'dirt',  stype:'sand'},
 {name:'Snow Tundra',  emoji:'❄️',side:'#eef4fa',road:'#e2ecf4',edge:'#9fb6ca',rtype:'salt',  stype:'snow'},
 {name:'Pine Forest',  emoji:'🌲',side:'#2f6b3a',road:'#a8794a',edge:'#274d2e',rtype:'plank', stype:'grass'},
 {name:'Stone Village',emoji:'🏡',side:'#57a05a',road:'#b9b3a6',edge:'#3f6b44',rtype:'cobble',stype:'grass'},
 {name:'Sakura Garden',emoji:'🌸',side:'#f3c5d5',road:'#ded4c8',edge:'#c99aad',rtype:'tile',  stype:'petal'},
 {name:'Frozen Lake',  emoji:'🧊',side:'#bcdff2',road:'#d2ecfa',edge:'#7fb3d6',rtype:'ice',   stype:'snow'},
 {name:'Highway',      emoji:'🛣️',side:'#6b7078',road:'#4a4f57',edge:'#3a3e45',rtype:'asphalt',stype:'plain',center:'#f4d03f'},
 {name:'Red Canyon',   emoji:'🪨',side:'#c4633f',road:'#cf8f5b',edge:'#8a4a2c',rtype:'rock',  stype:'rock'},
 {name:'Crystal Cave', emoji:'💎',side:'#7c5cbf',road:'#b9a6e8',edge:'#5b4494',rtype:'slab',  stype:'crystal',accent:'#efe9ff'},
 {name:'Rainforest',   emoji:'🌴',side:'#1f7a3d',road:'#6f5334',edge:'#14452a',rtype:'dirt',  stype:'grass'},
 {name:'Neon City',    emoji:'🌃',side:'#23262e',road:'#2e3340',edge:'#15171d',rtype:'tech',  stype:'neon',accent:'#35e0d8'},
 {name:'Salt Flats',   emoji:'🧂',side:'#f1efe6',road:'#e9e5d6',edge:'#c6c1ad',rtype:'salt',  stype:'plain'},
 {name:'Lava Land',    emoji:'🌋',side:'#3a2a26',road:'#46332d',edge:'#221714',rtype:'lava',  stype:'ember',accent:'#ff7a29'},
 {name:'Rice Terraces',emoji:'🌾',side:'#74b34a',road:'#8a6b46',edge:'#4d6b33',rtype:'dirt',  stype:'grass'},
 {name:'Planet Mars',  emoji:'🚀',side:'#d9713d',road:'#c05f36',edge:'#8f3b22',rtype:'rock',  stype:'rock'},
 {name:'Stone Castle', emoji:'🏰',side:'#8d9aa5',road:'#a9a29a',edge:'#5d656d',rtype:'brick', stype:'plain'},
 {name:'Steel City',   emoji:'⚙️',side:'#6d7684',road:'#83909f',edge:'#464e59',rtype:'tech',  stype:'metal',accent:'#9fd3ff'},
 {name:'Void Zone',    emoji:'👾',side:'#241a3a',road:'#31244d',edge:'#170f28',rtype:'slab',  stype:'star',accent:'#b26bff'}
];

/* ================= PROCEDURAL TEXTURES ================= */
const texCache={};
function roadTex(th,seed){
 const S=160,c=document.createElement('canvas');c.width=c.height=S;
 const x=c.getContext('2d'),R=mulberry32(seed*7919+13);
 const alt=shade(th.road,-16);
 x.fillStyle=th.road;x.fillRect(0,0,S,S);
 const wrap=fn=>{const px=R()*S,py=R()*S;for(const[dx,dy]of[[0,0],[-S,0],[S,0],[0,-S],[0,S]]){x.save();x.translate(px+dx,py+dy);fn();x.restore();}};
 const crackLine=(n,step)=>{x.beginPath();let cx0=R()*S,cy0=R()*S;x.moveTo(cx0,cy0);for(let s2=0;s2<n;s2++){cx0+=R()*step-step/2;cy0+=R()*step-step/2;x.lineTo(cx0,cy0);}x.stroke();};
 switch(th.rtype){
  case 'slab':{x.fillStyle=alt;x.fillRect(0,0,S,S);const g2=S/2;
   for(let a=0;a<2;a++)for(let b=0;b<2;b++){x.fillStyle=shade(th.road,Math.round(R()*18-6));x.fillRect(a*g2+3,b*g2+3,g2-6,g2-6);}
   x.strokeStyle='rgba(0,0,0,.15)';x.lineWidth=1.5;for(let k=0;k<3;k++)crackLine(4,30);
   if(th.accent){x.strokeStyle=th.accent;x.globalAlpha=.3;x.lineWidth=2;x.strokeRect(3,3,S-6,S-6);x.globalAlpha=1;}
   break;}
  case 'tile':{x.fillStyle=alt;x.fillRect(0,0,S,S);const g2=S/4;
   for(let a=0;a<4;a++)for(let b=0;b<4;b++){x.fillStyle=shade(th.road,((a+b)%2?-6:4)+Math.round(R()*8-4));x.fillRect(a*g2+2,b*g2+2,g2-4,g2-4);}
   break;}
  case 'cobble':{x.fillStyle=shade(th.road,-30);x.fillRect(0,0,S,S);
   for(let k=0;k<46;k++){const px=R()*S,py=R()*S,r0=6+R()*7,col=shade(th.road,Math.round(R()*26-10));
    for(const[dx,dy]of[[0,0],[-S,0],[S,0],[0,-S],[0,S]]){x.fillStyle=col;x.beginPath();x.ellipse(px+dx,py+dy,r0,r0*.8,R()*3,0,7);x.fill();}}
   break;}
  case 'dirt':{for(let k=0;k<26;k++)wrap(()=>{x.fillStyle=`rgba(${R()<.5?'0,0,0':'255,255,255'},${(.05+R()*.08).toFixed(2)})`;x.beginPath();x.ellipse(0,0,10+R()*22,6+R()*14,R()*3,0,7);x.fill();});
   speck(x,R,S,260,.10);break;}
  case 'plank':{const pw=S/5;
   for(let a=0;a<5;a++){x.fillStyle=shade(th.road,Math.round(R()*20-10));x.fillRect(a*pw+1,0,pw-2,S);
    x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=2;x.beginPath();x.moveTo(a*pw,0);x.lineTo(a*pw,S);x.stroke();
    x.strokeStyle='rgba(0,0,0,.10)';x.lineWidth=1;
    for(let g3=0;g3<4;g3++){const gx=a*pw+3+R()*(pw-6);x.beginPath();x.moveTo(gx,0);x.bezierCurveTo(gx+R()*6-3,S*.33,gx+R()*6-3,S*.66,gx,S);x.stroke();}
    x.fillStyle='rgba(0,0,0,.25)';x.fillRect(a*pw,R()*S,pw,2);}
   break;}
  case 'ice':{x.lineCap='round';
   x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=1.5;for(let k=0;k<7;k++)crackLine(5,50);
   x.strokeStyle='rgba(120,180,220,.4)';for(let k=0;k<5;k++)crackLine(5,50);
   speck(x,R,S,120,.08);break;}
  case 'asphalt':{speck(x,R,S,420,.13);
   x.fillStyle='rgba(255,255,255,.05)';for(let k=0;k<6;k++){x.beginPath();x.ellipse(R()*S,R()*S,20+R()*20,10+R()*10,R()*3,0,7);x.fill();}
   break;}
  case 'tech':{x.fillStyle=alt;x.fillRect(0,0,S,S);const g2=S/2;
   for(let a=0;a<2;a++)for(let b=0;b<2;b++){x.fillStyle=shade(th.road,Math.round(R()*14-7));x.fillRect(a*g2+4,b*g2+4,g2-8,g2-8);
    x.fillStyle=th.accent;for(const[rx,ry]of[[9,9],[g2-9,9],[9,g2-9],[g2-9,g2-9]]){x.beginPath();x.arc(a*g2+rx,b*g2+ry,2.4,0,7);x.fill();}}
   x.strokeStyle=th.accent;x.globalAlpha=.5;x.lineWidth=2;x.strokeRect(1,1,S-2,S-2);x.globalAlpha=1;
   break;}
  case 'lava':{for(let k=0;k<18;k++)wrap(()=>{x.fillStyle=`rgba(0,0,0,${(.1+R()*.12).toFixed(2)})`;x.beginPath();x.ellipse(0,0,10+R()*20,7+R()*12,R()*3,0,7);x.fill();});
   x.lineCap='round';
   x.strokeStyle=th.accent;x.globalAlpha=.25;x.lineWidth=7;for(let k=0;k<5;k++)crackLine(5,56);
   x.globalAlpha=.9;x.lineWidth=2.5;for(let k=0;k<5;k++)crackLine(5,56);x.globalAlpha=1;
   speck(x,R,S,140,.12);break;}
  case 'brick':{x.fillStyle=alt;x.fillRect(0,0,S,S);const bh=S/8,bw=S/4;
   for(let r0=0;r0<8;r0++){const off=(r0%2)*bw/2;
    for(let b0=-1;b0<5;b0++){x.fillStyle=shade(th.road,Math.round(R()*22-11));x.fillRect(b0*bw+off+1.5,r0*bh+1.5,bw-3,bh-3);}}
   break;}
  case 'salt':{x.strokeStyle='rgba(140,135,115,.4)';x.lineWidth=1.2;for(let k=0;k<8;k++)crackLine(5,50);
   speck(x,R,S,180,.08);break;}
  case 'rock':{for(let k=0;k<22;k++)wrap(()=>{x.fillStyle=`rgba(0,0,0,${(.06+R()*.08).toFixed(2)})`;x.beginPath();x.ellipse(0,0,8+R()*16,5+R()*10,R()*3,0,7);x.fill();});
   for(let k=0;k<12;k++){const px=R()*S,py=R()*S,r0=5+R()*8,rot=R()*3;
    for(const[dx,dy]of[[0,0],[-S,0],[S,0],[0,-S],[0,S]]){

function genGate(L,s,rng,beforeBoss){
 const r=rng();let good;
 if(r<0.22)good={t:'mul',v:(rng()<0.14?3:2)};
 else good={t:'add',v:Math.max(2,Math.round(s*(0.55+rng()*0.6)))};
 let bad;
 if(rng()<0.28)bad={t:'div',v:2};else bad={t:'sub',v:Math.max(2,Math.round(s*(0.35+rng()*0.5)))};
 if(!beforeBoss&&rng()<0.16){
  const other=rng()<0.5?{t:'mul',v:2}:{t:'add',v:Math.max(2,Math.round(s*0.8))};
  return rng()<0.5?{left:good,right:other}:{left:other,right:good};
 }
 return rng()<0.5?{left:good,right:bad}:{left:bad,right:good};
}
function bossHP(L){return Math.round(55+30*L+2.5*L*L);}
function genLevel(L){
 const rng=mulberry32(L*1013904223+12345);
 const total=2300+L*240,sched=[];let d=380,pw=0;
 const nS=Math.min(6+Math.ceil(L*1.1),18),sizes=[];
 for(let i=0;i<nS;i++)sizes.push(Math.min(450,Math.round((40+L*14)*(0.85+rng()*0.6)+i*L*2)));
 const haz=[];
 if(L>=3)haz.push('saw');
 if(L>=4)haz.push('tnt');
 if(L>=5)haz.push('wall');
 if(L>=6)haz.push('meteor');
 if(L>=7)haz.push('cage','cage');
 for(let i=0;i<nS;i++){
  const s=sizes[i];
  sched.push({d,type:'gate',g:genGate(L,s,rng)});d+=240+rng()*130;
  const elite=L>=8&&rng()<0.22;
  if(L>=9&&rng()<0.28){
   sched.push({d,type:'pair',a:Math.min(340,Math.max(8,Math.round(s*0.8))),b:Math.min(340,Math.max(8,Math.round(s*0.8)))});
  }else sched.push({d,type:'squad',s,elite});
  d+=250+rng()*130+L*4;
  if(i>0&&pw<3&&rng()<0.45){sched.push({d:d+130,type:'power',kind:rng()<0.5?'rocket':'shield'});pw++;d+=170;}
  if(haz.length&&rng()<0.55){const k=haz[(rng()*haz.length)|0];sched.push({d:d+120,type:k});d+=360+rng()*140;}
 }
 if(L>=10)sched.push({d:total*0.55,type:'miniboss'});
 if(L>=13)sched.push({d:total*0.34,type:'meteor'});
 if(pw===0)sched.push({d:total*0.5,type:'power',kind:rng()<0.5?'rocket':'shield'});
 sched.push({d:total-480,type:'gate',g:genGate(L,Math.round(40+L*14),rng,true)});
 sched.push({d:total,type:'boss'});
 return{sched,total,scroll:92+L*4.2,start:18+Math.round(L*2.5)};
}

/* ================= ENDLESS SPAWN ================= */
function endlessSpawn(){const g=game,L=g.level,R=roadMetrics();
 const size=()=>Math.min(450,Math.round((40+L*14)*(0.85+Math.random()*0.6)+g.spawnI*L*1.6));
 const m=g.spawnI%9;
 if(m===0||m===2||m===5){const s=size();
  g.gates.push({y:-70,left:genGate(L,s,Math.random).left,right:genGate(L,s,Math.random).right,used:false,animT:0,chosen:null});
  g.spawnD=g.dist+rand(300,460);}
 else if(m===7){g.powers.push({x:R.cx+rand(-(R.w/2-50),R.w/2-50),y:-60,kind:Math.random()<0.5?'rocket':'shield',ph:Math.random()*6});g.spawnD=g.dist+rand(240,380);}
 else if(m===8&&L>=8&&g.dist>=g.nextMini){spawnMiniAt(Math.min(20,4+g.miniN*2));g.miniN++;g.nextMini=g.dist+3200;g.spawnD=g.dist+620;}
 else{
  const pool=['squad','squad','squad','squad'];
  if(L>=3)pool.push('saw');
  if(L>=4)pool.push('tnt');
  if(L>=5)pool.push('wall');
  if(L>=6)pool.push('meteor');
  if(L>=7)pool.push('cage','cage');
  if(L>=8)pool.push('elite','elite','pair');
  const k=pick(pool);
  if(k==='squad')spawnSquad(size(),R.cx+rand(-60,60));
  else if(k==='pair'){const s=Math.min(340,size());spawnSquad(s,R.x+R.w*0.28);spawnSquad(s,R.x+R.w*0.72);}
  else if(k==='elite')spawnSquad(size(),R.cx+rand(-60,60),true);
  else if(k==='saw')spawnSawEv();
  else if(k==='tnt')spawnTNTev();
  else if(k==='wall')spawnWallEv();
  else if(k==='meteor')spawnMeteorEv();
  else if(k==='cage')spawnCageEv();
  g.spawnD=g.dist+rand(300,460);
 }
 g.spawnI++;}

/* ================= UPDATE ================= */
function update(dt){
 const g=game;if(!g)return;
 g.time+=dt;
 const R=roadMetrics(),p=g.player;
 p.y=H*0.78;
 if(g.over){
  if(g.win){g.winT-=dt;
   if(Math.random()<dt*40)g.parts.push({x:rand(0,W),y:-10,vx:rand(-40,40),vy:rand(80,220),grav:60,life:rand(1.2,2),r:rand(3,5),col:pick(['#fbbf24','#34d399','#60a5fa','#f472b6','#fff'])});
   if(g.winT<=0&&!g.shown){g.shown=true;showWin();}}
  else{g.loseT-=dt;if(g.loseT<=0&&!g.shown){g.shown=true;showLose();}}
  updateFx(dt);return;
 }
 let kv=0;if(keys.ArrowLeft||keys.a||keys.A)kv--;if(keys.ArrowRight||keys.d||keys.D)kv++;
 if(kv){p.x+=kv*340*dt;clampPlayer();}
 g.dist+=g.scroll*dt;
 p.shield=Math.max(0,p.shield-dt);
 if(g.endless){
  const eff=Math.min(20,1+Math.floor(g.dist/1500));
  if(eff!==g.level){g.level=eff;g.theme=(eff-1)%THEMES.length;const th=THEMES[g.theme];
   g.floats.push({x:W/2,y:H*0.4,txt:th.emoji+' '+th.name,col:'#fff',life:1.5,big:true});}
  g.scroll=92+g.level*4.2;
  if(!g.boss){
   if(g.dist>=g.bossD){spawnBossAt(Math.min(20,5+g.bossN*2));g.bossN++;g.bossD=g.dist+2800+g.bossN*250;g.spawnD=g.dist+650;}
   else if(g.dist>=g.spawnD)endlessSpawn();
  }
 }else{
  for(const ev of g.events){if(!ev.done&&g.dist>=ev.d){ev.done=true;
   if(ev.type==='gate')g.gates.push({y:-70,left:ev.g.left,right:ev.g.right,used:false,animT:0,chosen:null});
   else if(ev.type==='squad')spawnSquad(ev.s,R.cx+rand(-60,60),ev.elite);
   else if(ev.type==='pair'){spawnSquad(ev.a,R.x+R.w*0.28);spawnSquad(ev.b,R.x+R.w*0.72);}
   else if(ev.type==='power')g.powers.push({x:R.cx+rand(-(R.w/2-50),R.w/2-50),y:-60,kind:ev.kind,ph:rand(0,6)});
   else if(ev.type==='saw')spawnSawEv();
   else if(ev.type==='tnt')spawnTNTev();
   else if(ev.type==='wall')spawnWallEv();
   else if(ev.type==='meteor')spawnMeteorEv();
   else if(ev.type==='cage')spawnCageEv();
   else if(ev.type==='miniboss')spawnMiniAt(g.level);
   else if(ev.type==='boss')spawnBossAt(g.level);
  }}
 }
 for(let i=g.gates.length-1;i>=0;i--){const gt=g.gates[i];gt.y+=g.scroll*dt;
  if(gt.used){gt.animT+=dt;if(gt.animT>0.8)g.gates.splice(i,1);continue;}
  if(gt.y>=p.y){gt.used=true;gt.chosen=p.x<R.cx?'left':'right';applyGate(gt[gt.chosen]);if(g.over)return;}
 }
 for(let i=g.powers.length-1;i>=0;i--){const pw=g.powers[i];pw.y+=g.scroll*dt*0.95;
  const dx=pw.x-p.x,dy=pw.y-p.y;
  if(dx*dx+dy*dy<(pR0(g)+26)**2){applyPower(pw.kind);g.powers.splice(i,1);continue;}
  if(pw.y>H+60)g.powers.splice(i,1);}
 const pR=pR0(g),pcy=p.y-10;
 /* --- SAWS --- */
 for(let i=g.hazards.length-1;i>=0;i--){const h=g.hazards[i];h.t+=dt;h.y+=g.scroll*dt;

   p.count-=(30+g.level*2.5)*dt*(p.shield>0?0.35:1);

   for(let j=g.squads.length-1;j>=0;j--){const s=g.squads[j];
    if((s.x-m.x)**2+(s.y-m.y)**2<(m.r+10)**2){g.kills+=Math.ceil(s.n);burst(s.x,s.y,'#e5484d',16);g.squads.splice(j,1);}}
   if(g.boss&&(g.boss.x-m.x)**2+(g.boss.y-m.y)**2<(m.r+g.boss.r)**2){g.boss.hp-=Math.round(g.boss.maxHp*0.02);g.boss.flash=.08;}
   if(g.mini&&(g.mini.x-m.x)**2+(g.mini.y-m.y)**2<(m.r+g.mini.r)**2){g.mini.hp-=Math.round(g.mini.maxHp*0.04);g.mini.flash=.08;}
   g.meteors.splice(i,1);}}
 /* --- CAGES --- */
 for(let i=g.cages.length-1;i>=0;i--){const c=g.cages[i];c.y+=g.scroll*dt;
  if((c.x-p.x)**2+(c.y-pcy)**2<46*46){
   p.count+=c.n;p.peak=Math.max(p.peak,p.count);
   g.floats.push(ft(c.x,c.y-34,'+'+c.n+' RESCUED!','#4ade80',1.2,true));

  if(c.y>H+60)g.cages.splice(i,1);}
 /* --- ENEMY SQUADS --- */
 for(let i=g.squads.length-1;i>=0;i--){const s=g.squads[i];
  s.t+=dt;s.y+=(g.scroll*0.55+s.speed)*dt;s.x+=Math.sin(s.t*2.1)*12*dt;
  if(s.y>p.y-360)s.x+=(p.x-s.x)*clamp(dt*1.5,0,1);
  const sR=prad(s.n),dx=Math.abs(s.x-p.x),dy=Math.abs(s.y-p.y);
  if(dx<(pR+sR)*0.5&&dy<(pR+sR)*0.42){

    p.count-=m*(s.elite?1.3:1);}

   if(Math.random()<dt*22)spawnPart(rand(s.x-14,s.x+14),rand(p.y-60,p.y-20),pick(['#e5484d','#3b82f6']));
   if(s.n<=0){burst(s.x,s.y,'#e5484d',14);g.squads.splice(i,1);continue;}
   if(p.count<=0){die();return;}
  }
  if(g.level>=3&&s.y>30&&s.y<p.y-100){

   if(s.shootT<=0){s.shootT=Math.max(0.75,2.0-g.level*0.09);
    const nb=Math.min(2+Math.floor(g.level/2),9);
    for(let k=0;k<nb&&g.ebullets.length<200;k++)
     g.ebullets.push({x:s.x+rand(-1,1)*sR*.7,y:s.y+rand(-10,10),vx:0,vy:0,sp:175+g.level*7+rand(-15,15),jx:rand(-55,55),aim:false});}

 }
 /* --- MINI-BOSS --- */

 }

 /* --- ROCKETS --- */
 for(let i=g.rockets.length-1;i>=0;i--){const r=g.rockets[i];r.t+=dt;

  if(r.t>4)hit=true;
  if(hit){rocketBoom(r);g.rockets.splice(i,1);continue;}
  if(r.y<-60||r.x<-60||r.x>W+60){if(r.target)rocketBoom(r);g.rockets.splice(i,1);}
 }
 /* --- ENEMY BULLETS --- */
 for(let i=g.ebullets.length-1;i>=0;i--){const e=g.ebullets[i];
  if(!e.aim){const a=Math.atan2(p.y-e.y,(p.x+e.jx)-e.x);e.vx=Math.cos(a);e.vy=Math.sin(a);e.aim=true;}
  e.x+=e.vx*e.sp*dt;e.y+=e.vy*e.sp*dt;
  if((e.x-p.x)**2+(e.y-p.y)**2<(pR*0.8)**2){
   if(p.shield>0)spawnPart(e.x,e.y,'#67e8f9');
   else{p.count--;g.hurt=.35;spawnPart(e.x,e.y,'#ef4444');sHit();}
   g.ebullets.splice(i,1);
   if(p.count<=0){die();return;}continue;}
  if(e.y>H+40||e.x<-40||e.x>W+40)g.ebullets.splice(i,1);
 }
 p.peak=Math.max(p.peak,p.count);
 if(g.boss&&g.boss.hp<=0){bossDie();if(g.over)return;}
 if(g.mini&&g.mini.hp<=0){miniDie();if(g.over)return;}
 updateFx(dt);
 g.shake=Math.max(0,g.shake-dt*22);
 g.hurt=Math.max(0,g.hurt-dt*1.6);
 g.hintT=Math.max(0,g.hintT-dt);
}
function pR0(g){return prad(g.player.count);}
function updateFx(dt){const g=game;
 for(let i=g.parts.length-1;i>=0;i--){const q=g.parts[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.grav||0)*dt;if(q.life<=0)g.parts.splice(i,1);}
 for(let i=g.floats.length-1;i>=0;i--){const f=g.floats[i];f.life-=dt;f.y-=36*dt;if(f.life<=0)g.floats.splice(i,1);}
}

 for(const p of panels){

  ctx.save();ctx.globalAlpha=a;

  ctx.fillStyle='#5b6470';

  ctx.strokeText(gateText(p.d),px,py+1);

 }
}

 for(const b of g.bullets){ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill();}
 ctx.fillStyle='#ff5a3c';
 for(const e of g.ebullets){ctx.beginPath();ctx.arc(e.x,e.y,5.5,0,7);ctx.fill();}
 for(const r of g.rockets){
  const a=Math.atan2(r.vy,r.vx);
  ctx.save();ctx.translate(r.x,r.y);ctx.rotate(a);
  ctx.fillStyle='#e5e7eb';rr2(ctx,-8,-3.5,13,7,3);
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(5,-3.5);ctx.lineTo(11,0);ctx.lineTo(5,3.5);ctx.closePath();ctx.fill();
  ctx.fillStyle=Math.random()<.5?'#fb923c':'#fde68a';
  ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-14-Math.random()*6,-2.5);ctx.lineTo(-14-Math.random()*6,2.5);ctx.closePath();ctx.fill();
  ctx.restore();
 }
 drawPlayer();
 for(const m of g.meteors)drawMeteor(m);
 for(const q of g.parts){ctx.globalAlpha=clamp(q.life*2,0,1);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();}
 ctx.globalAlpha=1;
 for(const f of g.floats){ctx.globalAlpha=clamp(f.life*1.6,0,1);
  ctx.font='900 '+(f.big?34:22)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.strokeText(f.txt,f.x,f.y);
  ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);}
 ctx.globalAlpha=1;
 ctx.restore();
 drawHUD(th);
 if(g.hurt>0){ctx.fillStyle='rgba(239,68,68,'+(g.hurt*.35)+')';ctx.fillRect(0,0,W,H);}
}

/* ================= FULLSCREEN ================= */
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
async function goFS(){
 const el=document.documentElement;
 try{if(el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}catch(e){}
 try{if(window.screen.orientation&&window.screen.orientation.lock)await window.screen.orientation.lock('portrait');}catch(e){}
 updFS();
}
function exitFS(){try{
 if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();
 else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();}catch(e){}}
async function toggleFS(){if(fsOn())exitFS();else await goFS();}
function updFS(){$('#btnFS').textContent=fsOn()?'🗗':'⛶';}
document.addEventListener('fullscreenchange',updFS);
document.addEventListener('webkitfullscreenchange',updFS);

/* ================= PWA (manifest statik + favicon dinamis) ================= */
function makeIcon(s){
 const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
 const u=s/100;
 const g=x.createLinearGradient(0,0,0,s);g.addColorStop(0,'#3b0a12');g.addColorStop(1,'#12060a');
 x.fillStyle=g;x.fillRect(0,0,s,s);
 x.fillStyle='#e8dcc0';
 for(const sd of[-1,1]){x.beginPath();
  x.moveTo(50+sd*8,34);
  x.quadraticCurveTo(50+sd*30,26,50+sd*22,4);
  x.quadraticCurveTo(50+sd*16,20,50+sd*6,30);
  x.closePath();x.fill();}
 x.fillStyle='#5c1126';x.beginPath();x.arc(50,54,30,0,7);x.fill();
 x.shadowColor='#ff1e1e';x.shadowBlur=12*u;x.fillStyle='#ff2020';
 x.beginPath();x.ellipse(40,50,6,3.6,-.3,0,7);x.fill();
 x.beginPath();x.ellipse(60,50,6,3.6,.3,0,7);x.fill();
 x.shadowBlur=0;
 x.fillStyle='#fff';x.beginPath();x.arc(40,50,1.8,0,7);x.fill();x.beginPath();x.arc(60,50,1.8,0,7);x.fill();
 x.fillStyle='#1a0508';roundRect(x,38,64,24,9,4);x.fill();
 x.fillStyle='#fff';
 x.beginPath();x.moveTo(42,64);x.lineTo(47,64);x.lineTo(44.5,70);x.closePath();x.fill();
 x.beginPath();x.moveTo(53,64);x.lineTo(58,64);x.lineTo(55.5,70);x.closePath();x.fill();
 return c.toDataURL('image/png');
}
function setupPWA(){
 try{
  const fav=document.createElement('link');fav.rel='icon';fav.href=makeIcon(64);document.head.appendChild(fav);
  const ati=document.createElement('link');ati.rel='apple-touch-icon';ati.href=makeIcon(180);document.head.appendChild(ati);
 }catch(e){}
 if('serviceWorker' in navigator&&location.protocol.match(/^https?$/)){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
 }
}

/* ================= UI ================= */
function hideAll(){document.querySelectorAll('.overlay').forEach(o=>o.classList.add('hidden'));}
function showScreen(sel){hideAll();$(sel).classList.remove('hidden');}
function setHUD(v){['#btnBack','#btnPause','#btnSnd','#btnFS'].forEach(s=>$(s).classList.toggle('hidden',!v));}
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1600);}
function showBest(){$('#bestLine').textContent='👑 Endless Best: '+bestScore();}
function buildGrid(){const gEl=$('#grid');gEl.innerHTML='';
 for(let i=1;i<=20;i++){const b=document.createElement('button');
  const lock=i>unlocked,st=starsArr[i-1]||0,th=THEMES[i-1];
  b.title=th.emoji+' '+th.name;
  b.className='lv'+(lock?' locked':'')+(st>0?' done':'');
  b.innerHTML=(lock?'🔒':i)+'<span class="st">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</span><span class="diff">'+(lock?'Locked':th.emoji+' '+diffName(i))+'</span>';
  b.onclick=()=>{ac();sClick();
   if(lock){toast('Complete level '+unlocked+' first!');return;}
   startLevel(i);};
  gEl.appendChild(b);}}
function goMenu(){screen='menu';game=null;exitFS();musicStop();setHUD(false);buildGrid();showBest();showScreen('#menu');}
function showWin(){const g=game,th=THEMES[g.theme],ratio=g.player.count/Math.max(1,g.player.peak);
 const st=ratio>=.65?3:ratio>=.35?2:1;
 unlocked=clamp(Math.max(unlocked,g.level+1),1,20);
 starsArr[g.level-1]=Math.max(starsArr[g.level-1]||0,st);saveProg();
 sWin();
 $('#winStars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
 $('#winTitle').textContent=g.level>=20?'🏆 ALL LEVELS COMPLETE!':'LEVEL '+g.level+' COMPLETE!';
 $('#winInfo').innerHTML='Troops left: <b>'+Math.ceil(g.player.count)+'</b> · Peak: <b>'+Math.ceil(g.player.peak)+'</b><br>Arena: '+th.emoji+' '+th.name+(g.level>=20?'<br>You are the Mob Rush legend! 🎉':'');
 $('#btnNext').classList.toggle('hidden',g.level>=20);
 showScreen('#win');}
function showLose(){const g=game;
 if(g.endless){
  const sc=calcScore(g);const old=bestScore();const rec=sc>old;
  if(rec){try{localStorage.setItem('mr20best',''+sc);}catch(e){}}
  $('#loseTitle').textContent='GAME OVER!';
  $('#loseInfo').innerHTML='Score: <b>'+sc+'</b> · Kills: <b>'+Math.floor(g.kills)+'</b><br>Best: <b>'+Math.max(sc,old)+'</b>'+(rec?' — NEW RECORD! 🎉':'');
 }else{
  const th=THEMES[g.theme];
  $('#loseTitle').textContent='Your Army Is Gone!';
  $('#loseInfo').innerHTML='Level '+g.level+' · '+th.emoji+' '+th.name+'<br>Peak army: <b>'+Math.ceil(g.player.peak)+'</b><br>Pick green/yellow gates, avoid the red ones!';
 }
 showScreen('#lose');}
 $('#btnEndless').onclick=()=>{ac();sClick();startEndless();};
 $('#btnPause').onclick=()=>{if(!game||game.over)return;sClick();game.paused=true;musicStop();showScreen('#pause');};
 $('#btnResume').onclick=()=>{sClick();if(game)game.paused=false;musicStart();hideAll();};
function retry(){if(!game)return;if(game.endless)startEndless();else startLevel(game.level);}
 $('#btnRetry1').onclick=()=>{sClick();retry();};
 $('#btnRetry2').onclick=()=>{sClick();retry();};
 $('#btnNext').onclick=()=>{sClick();const l=Math.min(20,game.level+1);startLevel(l);};
 $('#btnMenu1').onclick=()=>{sClick();goMenu();};
 $('#btnMenu2').onclick=()=>{sClick();goMenu();};
 $('#btnMenu3').onclick=()=>{sClick();goMenu();};
 $('#btnBack').onclick=()=>{ac();sClick();goMenu();};
 $('#btnFS').onclick=()=>{ac();sClick();toggleFS();};
function sndIcon(){$('#btnSnd').textContent=sound?'🔊':'🔇';}
 $('#btnSnd').onclick=()=>{sound=!sound;try{localStorage.setItem('mr20snd',sound?'1':'0');}catch(e){}sndIcon();
 if(sound){if(screen==='play'&&game&&!game.paused)musicStart();}else musicStop();
 sClick();};
sndIcon();buildGrid();showBest();setupPWA();showScreen('#menu');

/* ================= LOOP ================= */
let last=0;
function loop(t){requestAnimationFrame(loop);
 const dt=Math.min(.033,(t-last)/1000||.016);last=t;
 if(screen==='play'){if(game&&!game.paused)update(dt);if(game)draw();}
 else{menuDist+=dt*40;draw();}
}
requestAnimationFrame(loop);
</script>
